<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaTech: Dibujo exprés</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#000d1f;--panel:#06182f;--line:#12457c;--blue:#0a84ff;--cyan:#00a6ff;--tx:#e8eef7;--mu:#8fa6c4;--bad:#d64550}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Montserrat,system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -10%,#0a3a7a66,transparent),var(--bg)}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:400}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.bar{width:56px;height:4px;background:var(--blue);margin-bottom:14px}
h1{font-size:clamp(34px,6vw,56px);margin:0 0 6px}
h2{font-size:clamp(24px,4vw,34px);margin:0}
.sub{color:var(--mu);margin:0 0 20px;line-height:1.5}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
input[type=number],input[type=text],select{width:100%;background:#00122a;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:16px 0}
button{font:inherit;font-weight:600;cursor:pointer;color:var(--tx);background:#0a2447;border:1px solid var(--line);border-radius:8px;padding:12px 16px}
button:hover{border-color:var(--cyan)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button.p{background:var(--blue);border-color:var(--blue);color:#fff}
button.sel{background:var(--blue);border-color:var(--cyan);color:#fff}
button.neg.sel{background:var(--bad);border-color:var(--bad)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.scores{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.sc{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:8px;padding:10px 14px}
.sc small{color:var(--mu);display:block}
.sc b{font-family:'Playfair Display',Georgia,serif;font-size:34px;font-weight:400;color:var(--tc)}
.timer{font-family:'Playfair Display',Georgia,serif;font-size:clamp(90px,24vw,200px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.timer.low{color:var(--bad)}
.concept{font-family:'Playfair Display',Georgia,serif;font-size:clamp(28px,6vw,54px);line-height:1.2;text-align:center;padding:26px 12px;border:1px dashed var(--cyan);border-radius:10px;margin:14px 0;color:var(--cyan);min-height:120px;display:flex;align-items:center;justify-content:center}
.concept.hidden{color:var(--mu);border-color:var(--line);font-size:clamp(20px,4vw,28px);font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row h3{margin:0;font-size:24px;color:var(--tc,var(--tx));min-width:110px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;font-size:13px}
.win td{color:var(--cyan);font-weight:700}
dt{color:var(--cyan);font-weight:600;margin-top:12px}
dd{margin:2px 0 0;color:var(--mu);line-height:1.5}
.rule{color:var(--mu);font-size:14px;line-height:1.6}
#qr{background:#fff;padding:14px;border-radius:8px;width:max-content;max-width:100%;margin:12px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* [frase, definición, nivel] nivel 1 = concretos, 2 = metáforas */
const POOL=[
["Dos jefes dándose la espalda","Conflicto entre Ventas y Producción: las áreas no se coordinan.",1],
["Gráfica de ventas cayendo","Caída de ventas del 20%: riesgo alto que se debe solucionar.",1],
["Empleados saliendo por la puerta","Alta rotación de personal: riesgo alto que se mitiga.",1],
["Cada área en su isla","Silos entre áreas: no comparten información ni metas.",1],
["Decidir con los ojos vendados","Falta de indicadores y datos para decidir.",1],
["Organigrama de la empresa","Estructura jerárquica: Dirección General, Ventas, Producción, I+D, Talento Humano y Finanzas.",1],
["Cliente yéndose enojado","Pérdida de clientes: amenaza por la mala coordinación entre áreas.",1],
["Camión de entrega llegando tarde","Entregas tardías: efecto de que Ventas y Producción no están alineadas.",1],
["Equipo jalando la misma cuerda","Alinear Ventas y Producción con metas comunes.",1],
["Tablero con indicadores","KPIs de ventas, rotación y coordinación para decidir con datos.",1],
["Paraguas contra la tormenta","Mitigar un riesgo: reducir su probabilidad o su impacto.",2],
["Lupa sobre un proyecto nuevo","Estudio de factibilidad: análisis operativo, técnico, económico y de tiempo.",2],
["Imán que atrae a los empleados","Plan de retención: acciones para que el personal clave se quede.",2],
["Puente entre dos edificios","Alinear Ventas y Producción: comunicación y metas comunes entre áreas.",2],
["Cerebros escapando de la oficina","Fuga de talento: se van personas valiosas a otras empresas.",2],
["Binoculares vigilando a un rival","Presión de la competencia: riesgo que se acepta y se monitorea.",2],
["Oficina con nubes de tormenta","Mal clima laboral: tensión entre áreas y alta rotación.",2],
["Escalera en tres peldaños","Plan por horizontes: corto, mediano y largo plazo.",2],
["Balanza entre costo y beneficio","Evaluar si una inversión es viable antes de ejecutarla.",2],
["Rueda que gira y mejora","Mejora continua: medir resultados y ajustar procesos.",2],
["Planeación","Definir objetivos y las acciones para lograrlos. Primera etapa del proceso administrativo.",3],
["Organización","Estructurar áreas, cargos y recursos, como se ve en el organigrama.",3],
["Dirección","Guiar e influir en las personas para alcanzar las metas.",3],
["Control","Medir resultados con indicadores y corregir desviaciones.",3],
["Riesgos","Eventos que pueden afectar a la empresa. Se clasifican por nivel y se solucionan, mitigan o aceptan.",3],
["Coordinación","Lograr que las áreas trabajen en conjunto, como Ventas y Producción.",3],
["Liderazgo","Capacidad de inspirar y orientar a un equipo hacia un objetivo.",3],
["Delegar","Asignar tareas y autoridad a otras personas del equipo.",3],
["Comunicación","Intercambio claro de información entre personas y áreas.",3],
["Toma de decisiones","Elegir entre alternativas, idealmente con datos e indicadores.",3],
["Estrategia","Plan a largo plazo para lograr una ventaja y alcanzar los objetivos.",3],
["Objetivos","Resultados concretos y medibles que la empresa quiere lograr.",3],
["Eficiencia","Lograr resultados usando bien el tiempo y los recursos.",3],
["Motivación","Lo que impulsa a las personas a rendir y permanecer en la empresa.",3],
["Trabajo en equipo","Colaboración de varias personas hacia una meta común.",3],
["Presupuesto","Plan de ingresos y gastos que guía las inversiones.",3],
["Jerarquía","Niveles de autoridad dentro de la organización.",3],
["Productividad","Relación entre lo que se produce y los recursos que se usan.",3]
];
const LV={1:"Concretos (se dibujan directo)",2:"Metáforas (más difíciles)",3:"Palabras de administración",4:"Mixto (todos)"};
const TC=["#3d86ff","#00b8ff","#9a86ff","#e8eef7"];
const $=s=>document.querySelector(s),app=$("#app");
let S={};
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function order(seed,lv){const a=POOL.filter(c=>lv===4||c[2]===lv),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=660;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},450)}catch(e){}}
const board=()=>`<div class="scores">${S.total.map((p,t)=>`<div class="sc" style="--tc:${TC[t]}"><small>Equipo ${t+1}</small><b>${p}</b></div>`).join("")}</div>`;

function setup(){
 clearInterval(S.iv);
 const seed=1000+Math.floor(Math.random()*9000),here=/^https?:/.test(location.href)?location.href.split("#")[0]:"";
 app.innerHTML=`<div class="bar"></div><h1>Dibujo exprés</h1>
 <p class="sub">NovaTech. Un dibujante por equipo dibuja la frase sin letras ni palabras. Su equipo adivina.</p>
 <div class="box"><h2>Configuración del anfitrión</h2>
 <div class="grid3">
 <div><label for="nt">Equipos (2 a 4)</label><input id="nt" type="number" min="2" max="4" value="2"></div>
 <div><label for="nr">Rondas (1 a 10)</label><input id="nr" type="number" min="1" max="10" value="8"></div>
 <div><label for="ns">Segundos por ronda</label><input id="ns" type="number" min="15" max="180" step="5" value="45"></div>
 <div><label for="nv">Nivel</label><select id="nv"><option value="1">${LV[1]}</option><option value="2">${LV[2]}</option><option value="3">${LV[3]}</option><option value="4" selected>${LV[4]}</option></select></div></div>
 <p class="rule">Primer equipo en acertar: +3. Otro equipo que también acierte a tiempo: +1. Dibujante que escribe letras o dice palabras: -2. Tú decides si la respuesta captura la idea, aunque no repita las palabras exactas.</p>
 <div class="ctl"><button class="p" id="go">Iniciar juego</button></div></div>
 <div class="box"><h2 style="font-size:24px">Panel privado en tu celular</h2>
 <p class="rule">Escanea este código QR con tu celular antes de proyectar. Ahí verás cada frase sin que los estudiantes la vean. Al iniciar el juego, el QR desaparece de la pantalla.</p>
 <label for="ur">Dirección de esta página en internet</label>
 <input id="ur" type="text" value="${here}" placeholder="https://tuusuario.github.io/dibujo.html" autocomplete="off">
 <div id="qr"></div><p class="rule" id="qn"></p>
 <div class="ctl"><button id="hq">Ocultar QR</button></div></div>`;
 const draw=()=>{
  const box=$("#qr"),u=$("#ur").value.trim().split("#")[0],lv=$("#nv").value,code=seed+"-"+lv;box.innerHTML="";
  if(!/^https?:\/\/./.test(u)){box.style.display="none";$("#qn").textContent="Para generar el QR, la página debe estar publicada en internet (por ejemplo en GitHub Pages). Pega su dirección arriba. Código manual: "+code;return}
  if(typeof QRCode==="undefined"){box.style.display="none";$("#qn").textContent="No se pudo cargar el generador de QR. Abre este enlace en tu celular: "+u+"#privado="+code;return}
  box.style.display="block";new QRCode(box,{text:u+"#privado="+code,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
  $("#qn").textContent="Código manual por si no puedes escanear: "+code};
 $("#nv").onchange=draw;$("#ur").oninput=draw;
 $("#hq").onclick=function(){const b=$("#qr");const hide=b.style.display!=="none";if(hide){b.style.display="none";this.textContent="Mostrar QR"}else{draw();this.textContent="Ocultar QR"}};
 draw();
 $("#go").onclick=()=>{
  const v=(id,a,b)=>Math.min(b,Math.max(a,parseInt($(id).value)||a));
  const nt=v("#nt",2,4),ns=v("#ns",15,180),lv=+$("#nv").value,list=order(seed,lv),nr=Math.min(v("#nr",1,10),list.length);
  S={nt,nr,ns,lv,seed,order:list.slice(0,nr),r:0,total:Array(nt).fill(0)};
  prep()}}

function prep(){
 clearInterval(S.iv);
 app.innerHTML=`<div class="top"><div><div class="bar"></div><h2>Ronda ${S.r+1} de ${S.nr}</h2></div><button id="end">Terminar juego</button></div>${board()}
 <div class="box"><p class="rule" style="margin:0 0 14px">La frase de esta ronda está en tu panel privado. Llama a un dibujante por equipo, muéstrales la frase en tu celular y pasen a la pizarra.</p>
 <button class="p" id="st">Iniciar ${S.ns} segundos</button></div>`;
 $("#st").onclick=play;$("#end").onclick=final}

function play(){
 S.left=S.ns;S.paused=false;
 app.innerHTML=`<div class="top"><div><div class="bar"></div><h2>Ronda ${S.r+1} de ${S.nr}</h2></div>
 <div class="ctl"><button id="m">-10 s</button><button id="pl">+10 s</button><button id="pz">Pausar</button><button class="p" id="fn">Terminar ronda</button></div></div>
 <div class="timer" id="tm">${mmss(S.left)}</div>`;
 $("#m").onclick=()=>{S.left=Math.max(1,S.left-10);tick()};
 $("#pl").onclick=()=>{S.left+=10;tick()};
 $("#pz").onclick=function(){S.paused=!S.paused;this.textContent=S.paused?"Reanudar":"Pausar"};
 $("#fn").onclick=()=>{clearInterval(S.iv);score()};
 clearInterval(S.iv);
 S.iv=setInterval(()=>{if(S.paused)return;S.left--;if(S.left<=0){S.left=0;tick();beep();clearInterval(S.iv);score()}else tick()},1000)}

function tick(){const t=$("#tm");t.textContent=mmss(S.left);t.classList.toggle("low",S.left<=5)}

function score(){S.sc=Array.from({length:S.nt},()=>({g:0,p:false}));drawScore()}

function drawScore(){
 const c=S.order[S.r];
 app.innerHTML=`<div class="top"><div><div class="bar"></div><h2>Ronda ${S.r+1}: resultado</h2></div></div>
 <div class="box"><p class="sub" style="margin:0">La frase era</p><div class="concept" style="min-height:0;padding:16px">${c[0]}</div><p class="rule" style="margin:0;text-align:center">${c[1]}</p></div>
 <div class="box">${S.sc.map((s,t)=>`<div class="row" style="--tc:${TC[t]}"><h3>Equipo ${t+1}</h3><div class="opts">
 <button data-t="${t}" data-g="3" class="${s.g===3?"sel":""}">Acertó primero +3</button>
 <button data-t="${t}" data-g="1" class="${s.g===1?"sel":""}">Acertó también +1</button>
 <button data-t="${t}" data-g="0" class="${s.g===0?"sel":""}">No acertó</button>
 <button data-t="${t}" data-p="1" class="neg ${s.p?"sel":""}">Penalizar -2</button></div></div>`).join("")}</div>
 <button class="p" id="ok">Confirmar y continuar</button>`;
 app.querySelectorAll("button[data-t]").forEach(b=>b.onclick=()=>{
  const t=+b.dataset.t;
  if(b.dataset.p)S.sc[t].p=!S.sc[t].p;
  else{const g=+b.dataset.g;if(g===3)S.sc.forEach(s=>{if(s.g===3)s.g=0});S.sc[t].g=g}
  drawScore()});
 $("#ok").onclick=()=>{S.sc.forEach((s,t)=>S.total[t]+=s.g-(s.p?2:0));
  if(S.r+1>=S.nr)final();else{S.r++;prep()}}}

function final(){
 clearInterval(S.iv);
 const played=S.order.slice(0,Math.min(S.nr,S.r+1));
 const rk=S.total.map((p,t)=>({t,p})).sort((a,b)=>b.p-a.p),tie=rk.length>1&&rk[0].p===rk[1].p;
 app.innerHTML=`<div class="bar"></div><h1>Resultados finales</h1>
 <p class="serif" style="font-size:clamp(28px,5vw,44px);color:var(--cyan);margin:0 0 16px">${tie?"Empate en el primer lugar":"Gana el Equipo "+(rk[0].t+1)}</p>
 <div class="box"><table><tr><th>Puesto</th><th>Equipo</th><th>Puntos</th></tr>
 ${rk.map((r,i)=>`<tr class="${r.p===rk[0].p?"win":""}"><td>${i+1}</td><td>Equipo ${r.t+1}</td><td>${r.p}</td></tr>`).join("")}</table></div>
 <div class="box"><h2 style="font-size:24px">Frases de la partida</h2><dl style="margin:0">${played.map(c=>`<dt>${c[0]}</dt><dd>${c[1]}</dd>`).join("")}</dl></div>
 <button class="p" id="again">Jugar de nuevo</button>`;
 $("#again").onclick=setup}

/* Panel privado: se abre en el celular con el QR y muestra la frase de cada ronda */
function priv(code){
 clearInterval(S.iv);
 const P={r:0,show:false};
 app.innerHTML=`<div class="bar"></div><h1>Panel privado</h1>
 <p class="sub">Solo para el anfitrión. Avanza de ronda cuando la pantalla del juego avance.</p>
 <div class="box"><label for="pc">Código de partida</label><input id="pc" type="text" inputmode="numeric" placeholder="Ejemplo: 4821-4" autocomplete="off" value="${code||""}">
 <div class="row"><button id="pp">Anterior</button><h3 id="pr">Ronda 1</h3><button id="pn">Siguiente</button></div>
 <div class="concept hidden" id="pcn"></div><p class="rule" id="pd"></p>
 <div class="ctl"><button class="p" id="ps">Mostrar frase</button></div></div>`;
 const upd=()=>{
  const m=/^\s*(\d{4})-([1234])\s*$/.exec($("#pc").value),cn=$("#pcn"),pd=$("#pd");
  $("#ps").textContent=P.show?"Ocultar frase":"Mostrar frase";
  if(!m){cn.textContent="Escribe el código de la partida";cn.classList.add("hidden");pd.textContent="";$("#pr").textContent="Ronda "+(P.r+1);return}
  const list=order(+m[1],+m[2]);if(P.r>=list.length)P.r=list.length-1;
  $("#pr").textContent="Ronda "+(P.r+1)+" de "+list.length;
  cn.textContent=P.show?list[P.r][0]:"Frase oculta";cn.classList.toggle("hidden",!P.show);
  pd.textContent=P.show?list[P.r][1]:""};
 $("#pc").oninput=()=>{P.show=false;upd()};
 $("#pp").onclick=()=>{P.r=Math.max(0,P.r-1);P.show=false;upd()};
 $("#pn").onclick=()=>{P.r++;P.show=false;upd()};
 $("#ps").onclick=()=>{P.show=!P.show;upd()};
 upd()}

const h=/^#privado(?:=(\d{4}-[1234]))?$/.exec(location.hash);
h?priv(h[1]||""):setup();
</script>
</body>
</html>
