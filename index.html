<style>

*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:clamp(14px,1.35vw,20px)/1.45 system-ui,"Segoe UI",sans-serif;background:linear-gradient(rgba(9,12,19,.9),rgba(9,12,19,.96)),repeating-linear-gradient(0deg,transparent 0 39px,#16203a 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#16203a 39px 40px),var(--bg)}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.g2>div{background:var(--panel2);border-radius:10px;padding:12px;font-size:.9em}.g2 b{display:block;color:var(--gold);margin-bottom:3px}
select,input{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#0b1220;color:var(--ink);width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}.row label{flex:1;min-width:180px}
.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.tm label{display:flex;gap:8px;align-items:center}.tm i{width:12px;height:30px;border-radius:3px;flex:none}

<script>
const $=s=>document.querySelector(s),app=$("#app"),COL=["#e5484d","#3b82f6","#e0b43a","#2fb671","#a855f7","#f08a24"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ===== AUDIO (todo sintetizado, sin archivos) ===== */
let AC,mus,sfx,NB,musicOn=true,sfxOn=true,custom=null,mode="intro",sched=null,step=0,nextT=0;
const mtof=m=>440*2**((m-69)/12);
function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();const m=AC.createGain();m.connect(AC.destination);mus=AC.createGain();sfx=AC.createGain();mus.connect(m);sfx.connect(m);sfx.gain.value=.8;NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;setMode(mode)}
function tone(f,t,d,ty="sine",v=.2,dst=sfx,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,ty,fr,dst=sfx){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=ty;f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dst);s.start(t);s.stop(t+d)}
/* Groove original (estilo "drama de oficina"): bajo + batería + acordes */
const ROOT=[40,40,36,38],BASS=[0,-1,-1,0,-1,7,-1,0,-1,-1,10,-1,12,-1,7,-1];
function play16(s,t){const st=s%16,bar=(s>>4)%4,r=ROOT[bar],v=mode==="game"?.8:1;
 if([0,6,10].includes(st)||(mode==="tense"&&st%4==0)){tone(150,t,.16,"sine",.9*v,mus,45)}
 if(st==4||st==12){noise(t,.14,.5*v,"bandpass",1800,mus);tone(190,t,.08,"triangle",.3*v,mus)}
 if(st%2==0)noise(t,.04,(st%4==2?.22:.12)*v,"highpass",8000,mus);if(mode==="tense"&&st%2)noise(t,.03,.12,"highpass",9000,mus);
 if(st==14)noise(t,.18,.14*v,"highpass",7000,mus);
 if(BASS[st]>=0)tone(mtof(r+BASS[st]),t,.2,"square",.2*v,mus);
 if(mode==="intro"&&(st==3||st==7||st==11))[24,27,31,34].forEach(n=>tone(mtof(r+n),t,.12,"sawtooth",.04,mus))}
function pump(){while(nextT<AC.currentTime+.15){play16(step,nextT);nextT+=60/104/4;step=(step+1)%64}}
function setMode(m){mode=m;if(!AC)return;const g=m==="intro"?.55:m==="tense"?.4:.3;mus.gain.setTargetAtTime(g,AC.currentTime,.2);if(custom)custom.volume=m==="intro"?.8:.4}
function music(on){if(!AC)return;if(custom){on&&musicOn?custom.play():custom.pause();return}if(on&&musicOn&&!sched){nextT=AC.currentTime+.05;step=0;sched=setInterval(pump,25)}else if(!on||!musicOn){clearInterval(sched);sched=null}}
const S={
 ok(t){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.08,.3,"triangle",.28))},
 bad(t){tone(160,t,.6,"sawtooth",.3,sfx,60);tone(120,t,.6,"square",.15,sfx,50)},
 stamp(t){noise(t,.25,.9,"lowpass",600);tone(90,t,.3,"sine",.9,sfx,40)},
 tick(t){tone(1300,t,.05,"square",.08)},horn(t){tone(220,t,.7,"sawtooth",.3);tone(223,t,.7,"sawtooth",.3)},
 whoosh(t){noise(t,.5,.35,"bandpass",1400)},coin(t){tone(988,t,.08,"square",.12);tone(1319,t+.08,.35,"square",.12)},
 win(t){[[392,494,587],[392,494,587],[440,554,659],[523,659,784,1047]].forEach((c,i)=>c.forEach(f=>tone(f,t+i*.28,i==3?1.4:.3,"sawtooth",.07)))}};
const snd=n=>{if(AC&&sfxOn)S[n](AC.currentTime)};
if($("#bm"))$("#bm").onclick=e=>{initAudio();musicOn=!musicOn;e.target.classList.toggle("off",!musicOn);music(musicOn)};
if($("#bs"))$("#bs").onclick=e=>{initAudio();sfxOn=!sfxOn;e.target.classList.toggle("off",!sfxOn)};
if($("#fm"))$("#fm").onchange=e=>{const f=e.target.files[0];if(!f)return;initAudio();music(false);custom=new Audio(URL.createObjectURL(f));custom.loop=true;setMode(mode);music(true)};

function overlay(h,ms,cb){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div>${h}</div>`;document.body.appendChild(o);setTimeout(()=>{o.remove();cb&&cb()},ms)}
function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:6+Math.random()*7,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(0,0,p.s,p.s/2);x.restore()});if(++f<420)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
const DOCS=[
{t:"Reclamo de siniestro",ty:"x",T:180,x:"Buenas tardes. Les escribo por segunda vez porque el {{12 de octubre}} tuve un accidente y todavía nadie me da respuesta. Soy [[Valeria Arce Montero]] y mi esposo es [[Rolando Quirós Pineda]], quien aparece como asegurado en la {{Póliza Auto Plus}}, número [[POL-5530-218]]. Yo manejaba nuestro vehículo, un {{sedán gris modelo 2022}} con placa [[MKP-319]], cuando un camión nos golpeó por detrás en {{Tres Ríos}}, frente a una {{estación de servicio}}. Llegó el oficial [[Jorge Campos Salas]] y levantó el parte [[PT-2026-88412]]; mi vecina [[Karina Solís]], que venía conmigo de regreso del trabajo, fue testigo y firmó la declaración. A mí me llevaron a urgencias y me diagnosticaron [[esguince cervical]] y [[contusión en la rodilla izquierda]]; el médico me dio {{10 días}} de incapacidad, que ya envié por correo. Les adjunté también la factura del taller por ₡385 000, que corresponde al deducible y las reparaciones iniciales; la pagué con la tarjeta terminada en {{4417}}, aunque la que aparece en el comprobante es la [[4539 1488 0343 6467]]. Necesito que el reembolso se deposite en la cuenta [[CR21 0152 0200 1034 7788 02]], a nombre de mi esposo. Pueden escribirme a [[valeria.arce@tmail.com]] o llamarme al [[8845-2210]] en {{horario de oficina}}. Si necesitan verificar el carro, estoy en [[Urbanización Monte Verde, casa 22, Cartago]], a {{dos cuadras de la escuela}}. Les recuerdo que mi hija [[Sofía, de 9 años]], iba en el asiento trasero y también fue revisada por un pediatra, quien pidió {{una radiografía de control}}. Quedo atenta.",why:"Se enmascaran nombres propios (incluidos terceros y una menor), identificadores como placa, parte y póliza, datos de salud, la tarjeta completa, la cuenta bancaria, el contacto y la dirección exacta. Fechas, lugares generales, nombres de producto, días de incapacidad, los últimos 4 dígitos y los horarios no identifican a nadie por sí solos."},
{t:"Consulta de nómina",ty:"x",T:180,x:"Hola, buen día. Soy [[Daniela Vargas Solano]], del departamento de {{Contabilidad}}, y escribo porque mi último pago salió incorrecto. Mi jefe directo, [[Mauricio Retana Badilla]], me pidió que primero lo revisara con ustedes antes de corregir el reporte del {{tercer trimestre}}. Mi salario bruto es de [[₡1 250 000]] mensuales, pero el monto depositado fue menor porque me rebajaron una [[pensión alimentaria de ₡120 000]] que ya no corresponde, pues mi hijo [[Mateo Solano, de 17 años]], terminó sus estudios. El depósito llega a la cuenta [[CR05 0152 0200 1026 2840 66]] y mi cédula es la [[1-1180-0452]]; mi número de empleada es el [[EMP-30871]]. Ayer intenté entrar al portal de la empresa con el usuario [[dvargas]] y la contraseña [[Dani2026*]], pero el sistema me bloqueó y me pidió un código que llegó al [[8845-2210]], aunque no me deja ingresarlo. Antes usaba el correo [[daniela.vargas@empresa.cr]] y ahora aparece otro. Trabajo en la {{sede de San Pedro}}, en el {{segundo piso}}, y mi compañera [[Lucía Barrantes]], que se sienta a mi lado, tiene el mismo problema con su pago y además está [[incapacitada por una cirugía de rodilla]]. Mi {{contrato es indefinido}}, la {{política de vacaciones}} no ha cambiado y mi horario es {{de ocho a cinco}}. Vivo en [[Residencial Las Orquídeas, casa 14, Heredia]], por si necesitan enviar documentos físicos. También quiero que me aclaren un rebajo por la póliza colectiva, ya que la {{aseguradora de la empresa}} cobró dos veces en {{agosto}}. Gracias de antemano.",why:"Hay datos financieros (salario, pensión, cuenta), credenciales, identificadores, contacto, dirección exacta, datos de salud de una compañera y de un menor, y nombres de terceros. El área, el trimestre, la sede, las condiciones generales del contrato y los horarios no identifican a nadie por sí solos."},
{t:"Chat de una clínica",ty:"x",T:180,x:"Buenas tardes, habla [[Esteban Mora Chaves]], cédula [[1-1203-0871]], nací el [[14 de marzo de 1990]]. Les escribo para {{reprogramar mi cita}} del jueves. Estoy en tratamiento por [[hipertensión]] con la doctora [[Karla Jiménez Araya]] y además hace un año me diagnosticaron [[apnea del sueño]], por lo que uso un equipo nocturno. En la última consulta me pidieron exámenes de laboratorio y el resultado de [[glucosa en ayunas de 126]] salió alto, así que tengo que repetirlo. Mi esposa, [[Mariela Campos]], también tiene cita en la {{misma clínica}} y le dijeron que es [[alérgica a la penicilina]], igual que nuestra hija [[Camila, de 7 años]], cuya pediatra, la doctora [[Ana Brenes]], pidió más exámenes. Quiero que los recordatorios lleguen al WhatsApp [[7012-3345]] o al correo [[esteban.mora@correo.cr]], pero no a la línea de la casa, porque ahí contesta mi suegra. La {{receta}} vence en {{dos semanas}} y la farmacia de mi {{barrio}} no tiene el medicamento. Mi seguro es el número [[SEG-9920-3351]] y pago {{una cuota mensual}} por el plan familiar, que incluye {{cobertura dental}}. Prefiero que la cita sea {{por la mañana}}, porque trabajo de {{tarde}}. Por último, vivo en [[Barrio Lourdes, frente al parque, San Pedro]], y la clínica me queda a {{diez minutos en carro}}. Si hace falta un comprobante de mi diagnóstico para mi empleador, pueden enviarlo al correo de mi jefa, [[Silvia Rojas]], aunque preferiría que no se enteren de mi condición. Muchas gracias.",why:"Son datos sensibles: identificación, fecha de nacimiento, diagnósticos y resultados de laboratorio, salud de la esposa y de una menor, nombres de médicos y de terceros, contacto, número de seguro y dirección. Trámites generales, plazos, horarios y características del plan no identifican a nadie."},
{t:"Cotización de seguro",ty:"x",T:180,x:"Hola, quiero asegurar un vehículo y necesito una {{cotización}} con cobertura completa. Es un {{modelo 2022}} de color {{gris}}, placa [[BQR-482]], que compré hace {{seis meses}} en una {{agencia de Escazú}}. Yo soy [[Luis Jiménez Soto]], nací el [[3 de agosto de 1988]] y mi cédula es [[2-0654-0319]]. Mi licencia de conducir es la [[A-0045-9921]] y está vigente hasta {{2029}}. He tenido {{dos reclamos previos}} con otra aseguradora y mi {{historial de pagos}} es bueno. Mi esposa, [[Mariana Quesada]], también será conductora autorizada, pero ella tuvo una [[suspensión de licencia por una multa de alcoholemia]] hace tres años y quiero saber si eso afecta el precio. Mi hijo [[Tomás, de 19 años]], manejará solo los fines de semana. Vivimos en [[Residencial Altos del Sol, casa 7, Alajuela]], y el carro duerme en un {{garaje cerrado}}. Pueden contactarme al [[luis.jimenez@mail.com]] o al [[8832-4410]], de preferencia {{después de las seis}}. Quiero pagar con la tarjeta [[4539 1488 0343 6467]], a nombre de mi esposa, en {{doce cuotas}}, y que el seguro {{inicie el próximo mes}}. Mi ingreso mensual es de [[₡2 100 000]] según mi última planilla, por si necesitan comprobar capacidad de pago, y mi cuenta para débitos es la [[CR14 0152 0200 1087 3344 19]]. Además, trabajo como {{ingeniero}} y viajo {{una vez al mes}} a la zona norte, así que el carro hace {{rutas largas}}. Quedo atento a su respuesta.",why:"Se enmascaran identificadores (placa, cédula, licencia), fecha de nacimiento, nombres de terceros y de un hijo, un antecedente de multa, dirección, contacto, la tarjeta completa, el ingreso y la cuenta. Las características generales del auto, el historial genérico, el oficio y las condiciones de pago no identifican a nadie."},
{t:"Soporte técnico de una app",ty:"x",T:180,x:"Hola, soy [[Andrea Salazar Mora]] y no puedo entrar a mi cuenta de la {{aplicación móvil}} desde ayer. Mi usuario es [[asalazar92]] y la contraseña que uso es [[Andre@2026#]]; también me llegó un código de verificación, el [[483 921]], pero ya venció. Mi número registrado es el [[8710-5567]] y mi correo es [[andrea.salazar@gmail.com]]. Estoy usando un {{celular Android}} con la {{versión más reciente}} de la app, conectada a la red de mi casa, y la dirección IP que aparece es la [[190.113.45.201]]. Mi hermano, [[Daniel Salazar]], dice que a él le pasó lo mismo, pero que lo resolvió {{reiniciando el teléfono}} y {{borrando la caché}}. En mi cuenta tengo un saldo de [[₡845 300]] y una tarjeta vinculada, la [[5412 7534 9821 0045]], que vence en [[08/28]]. Además, la app guarda mi ubicación y ayer aparecí en [[Condominio Vista Real, torre B, apartamento 304, Escazú]], aunque yo estaba en {{otra ciudad}}. Creo que alguien más entró, porque recibí una notificación de un pago a nombre de [[Fernando Ugalde]] por ₡15 000 que yo no hice. Mi cédula es [[1-1342-0768]] y el apellido de soltera de mi madre, que usé como pregunta de seguridad, es [[Ramírez Quesada]]. Les envío capturas donde se ve mi nombre completo y mis últimos movimientos. Prefiero que me respondan {{por este mismo chat}} y no por teléfono, porque trabajo en una {{oficina compartida}}. Mientras tanto, ya {{cambié la contraseña}} de mi correo y activé {{la verificación en dos pasos}}. Agradezco su pronta respuesta.",why:"Son credenciales (usuario, contraseña, código, pregunta de seguridad), contacto, dirección IP, saldo y tarjeta con vencimiento, una dirección exacta, cédula y nombres de terceros. El tipo de celular, la versión de la app, los pasos para resolver el problema y las medidas de seguridad generales no identifican a nadie."},

const head=`<div class="top"><div><div class="cap" style="color:${tc}">${esc(m.tm[S.tm].n)}</div><b>${esc(S.nm)}</b></div><b class="pts" id="pt"></b></div>`;
if(m.ph=="play"){const D=DOCS[m.di];app.innerHTML=`<div class="pw">${head}<div class="tp" style="--c:${tc}"><div class="th"><b>${esc(D.t)}</b></div><p style="font-size:.85em;margin:0 0 6px">${D.ty=="x"?"Toca los datos personales para tacharlos.":"Toca los ajustes que incumplen la normativa."}</p>${view(D,j=>({c:S.mk.has(j)?"m":"",a:0}))}</div><button class="go" id="sb" style="width:100%">${S.sb?"ENTREGADO":"ENTREGAR"}</button></div>`;
document.querySelectorAll("[data-j]").forEach(e=>e.onclick=()=>{if(S.sb)return;const j=+e.dataset.j;S.mk.has(j)?S.mk.delete(j):S.mk.add(j);e.classList.toggle("m");send()});$("#sb").onclick=()=>{S.sb=true;$("#sb").textContent="ENTREGADO";send()};tick()}
else if(m.ph=="rev"&&m.res){const r=m.res[S.tm],rk=m.lb.map((p,i)=>({p,i})).sort((a,b)=>b.p-a.p).findIndex(x=>x.i==S.tm)+1;app.innerHTML=`<div class="pw c">${head}<div class="box c"><div class="cap">Resultado del equipo</div><div class="pts" style="font-size:3em">${r.p>=0?"+":""}${r.p}</div><p>Detectaron ${r.h} de ${r.s}. Marcas de más: ${r.o}.${r.fast?" Bono de velocidad.":""}</p><p class="mut">Van en el puesto ${rk} con ${m.lb[S.tm]} puntos.</p></div></div>`}
else if(m.ph=="end"){const rk=m.lb.map((p,i)=>({p,i})).sort((a,b)=>b.p-a.p).findIndex(x=>x.i==S.tm)+1;app.innerHTML=`<div class="pw c">${head}<div class="box c"><div class="cap">Caso cerrado</div><h2>Su equipo quedó en el puesto ${rk}</h2><p class="pts">${m.lb[S.tm]} puntos</p></div></div>`}
else app.innerHTML=`<div class="pw c">${head}<div class="box c"><h2>Listo, estás dentro</h2><p class="mut">Esperando al presentador...</p></div></div>`};
const tick=()=>{clearInterval(dt);const f=()=>{const e=$("#pt");if(e&&S.m)e.textContent=Math.max(0,S.m.rem-Math.floor((Date.now()-S.rc)/1000))+" s"};f();dt=setInterval(f,1000)};
link(ROOM,m=>{if(!m.ph)return;S.m=m;S.rc=Date.now();const lk=m.ph+m.k+m.di;if(m.ph=="play"&&S.lk!=lk){S.mk=new Set();S.sb=false;send()}if(S.lk!=lk||m.ph=="lobby"||S.tm<0&&!$("#nm")){S.lk=lk;if(!document.activeElement||document.activeElement.id!="nm")draw()}},()=>{cli.subscribe(BASE(ROOM)+"h");draw();if(!S.hb)S.hb=setInterval(send,4000)})}
document.addEventListener("keydown",e=>{if(QP||e.code!="Space")return;if(["BUTTON","INPUT","SELECT"].includes(e.target.tagName))return;e.preventDefault();if(H.ph=="play")reveal();else if(H.ph=="rev")nextR()});
QP?player():setup();

</script></body></html>
